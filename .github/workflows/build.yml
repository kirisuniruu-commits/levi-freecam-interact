name: Build Levi Freecam Interact

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the uploaded files
        uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          unzip -q Levi-Freecam-Interact.zip -d project
          ls project

      - name: Install the Android NDK and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(command -v sdkmanager || ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;28.2.13676358" || echo "Could not install NDK 28.2, the build will use the NDK that is already on the runner"
          sudo apt-get update
          sudo apt-get install -y ninja-build zip

      - name: Build arm64-v8a levipack
        working-directory: project
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_ROOT/ndk/28.2.13676358" ]; then
            export ANDROID_NDK_HOME="$SDK_ROOT/ndk/28.2.13676358"
          fi
          echo "Using NDK: ${ANDROID_NDK_HOME:-not set}"
          bash ./scripts/build.sh

      - name: Upload the finished mod
        uses: actions/upload-artifact@v4
        with:
          name: levi-freecam-interact
          path: project/dist/arm64-v8a/levi-freecam.levipack
